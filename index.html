<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Доставок</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { text-align: center; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: calc(100% - 22px); padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        .results { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; }
        .results p { font-size: 18px; margin-bottom: 10px; }
        .results span { font-weight: bold; color: #007bff; }
        .reset-button { display: block; width: 100%; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 20px; }
        .reset-button:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Калькулятор Доставок</h1>

        <div class="input-group">
            <label for="clientPaymentCash">Скільки дав клієнт (готівкою за замовлення):</label>
            <input type="number" id="clientPaymentCash" value="0" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="deliveryEarnings">Скільки зароблено за доставку (від платформи):</label>
            <input type="number" id="deliveryEarnings" value="0" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="tipsCash">Чаєві (готівкою):</label>
            <input type="number" id="tipsCash" value="0" min="0" step="0.01">
        </div>

        <div class="input-group">
            <label for="tipsCard">Чаєві (безготівкові/з додатку):</label>
            <input type="number" id="tipsCard" value="0" min="0" step="0.01">
        </div>

        <div class="results">
            <p>Загально зароблені: <span id="totalEarned">0.00</span> грн</p>
            <p>Каса (готівка на руках): <span id="cashInHand">0.00</span> грн</p>
        </div>

        <button class="reset-button" onclick="resetCalculator()">Скинути</button>
    </div>

    <script>
        function calculate() {
            const clientPaymentCash = parseFloat(document.getElementById('clientPaymentCash').value) || 0;
            const deliveryEarnings = parseFloat(document.getElementById('deliveryEarnings').value) || 0;
            const tipsCash = parseFloat(document.getElementById('tipsCash').value) || 0;
            const tipsCard = parseFloat(document.getElementById('tipsCard').value) || 0;

            const totalEarned = deliveryEarnings + tipsCash + tipsCard;
            const cashInHand = clientPaymentCash + tipsCash;

            document.getElementById('totalEarned').textContent = totalEarned.toFixed(2);
            document.getElementById('cashInHand').textContent = cashInHand.toFixed(2);
        }

        function resetCalculator() {
            document.getElementById('clientPaymentCash').value = 0;
            document.getElementById('deliveryEarnings').value = 0;
            document.getElementById('tipsCash').value = 0;
            document.getElementById('tipsCard').value = 0;
            calculate(); // Recalculate to show 0.00
        }

        // Add event listeners to recalculate on input change
        document.getElementById('clientPaymentCash').addEventListener('input', calculate);
        document.getElementById('deliveryEarnings').addEventListener('input', calculate);
        document.getElementById('tipsCash').addEventListener('input', calculate);
        document.getElementById('tipsCard').addEventListener('input', calculate);

        // Initial calculation on page load
        document.addEventListener('DOMContentLoaded', calculate);
    </script>
</body>
</html>
