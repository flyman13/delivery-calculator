<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Доставок</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            max-width: 500px;
            width: 100%;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            margin-top: 0;
            color: #222;
            font-size: 24px;
        }
        .dashboard {
            background: #eef2ff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #c7d2fe;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            margin: 8px 0;
            font-weight: 600;
        }
        .stat-row.sub {
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }
        .val-kasa { color: #d97706; font-weight: 700; }
        .val-earned { color: #16a34a; font-weight: 700; }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            background: #e5e7eb;
            color: #374151;
            transition: 0.2s;
        }
        .tab-btn.active.bolt { background: #34d399; color: #064e3b; }
        .tab-btn.active.glovo { background: #fbbf24; color: #78350f; }
        .tab-btn.active.shabashka { background: #60a5fa; color: #1e3a8a; }

        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-add {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-add:hover { background: #1d4ed8; }

        .history {
            margin-top: 24px;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }
        .history h3 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #374151;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 220px;
            overflow-y: auto;
        }
        .history-item {
            background: #f9fafb;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #9ca3af;
        }
        .history-item.bolt { border-left-color: #10b981; }
        .history-item.glovo { border-left-color: #f59e0b; }
        .history-item.shabashka { border-left-color: #3b82f6; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-undo {
            flex: 1;
            padding: 12px;
            background: #6b7280;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset {
            flex: 1;
            padding: 12px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Калькулятор Доставок</h1>

        <div class="dashboard">
            <div class="stat-row">
                <span>Загальна Каса:</span>
                <span class="val-kasa"><span id="totalKasa">0</span> грн</span>
            </div>
            <div class="stat-row sub">
                <span>— Каса Bolt: <b id="boltKasa">0</b> грн</span>
                <span>— Каса Glovo: <b id="glovoKasa">0</b> грн</span>
            </div>
            <hr style="border:0; border-top:1px solid #c7d2fe; margin: 10px 0;">
            <div class="stat-row">
                <span>Загально зароблені:</span>
                <span class="val-earned"><span id="totalEarned">0</span> грн</span>
            </div>
            <div class="stat-row sub">
                <span>Bolt: <b id="boltEarned">0</b></span>
                <span>Glovo: <b id="glovoEarned">0</b></span>
                <span>Шабашки: <b id="shabashkaEarned">0</b></span>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active bolt" onclick="selectTab('bolt')">Bolt</button>
            <button class="tab-btn glovo" onclick="selectTab('glovo')">Glovo</button>
            <button class="tab-btn shabashka" onclick="selectTab('shabashka')">Шабашка</button>
        </div>

        <div id="clientFieldGroup" class="form-group">
            <label for="clientPaid">Скільки дав клієнт (0 якщо карткою):</label>
            <input type="number" id="clientPaid" placeholder="Наприклад: 950" value="">
        </div>

        <div class="form-group">
            <label for="deliveryPay">Скільки заробив за доставку:</label>
            <input type="number" id="deliveryPay" placeholder="Наприклад: 100" value="">
        </div>

        <div class="form-group">
            <label for="tipsPay">Чаєві:</label>
            <input type="number" id="tipsPay" placeholder="Наприклад: 50" value="">
        </div>

        <button class="btn-add" onclick="addDelivery()">+ Додати доставку</button>

        <div class="history">
            <h3>Історія доставок:</h3>
            <ul id="historyList" class="history-list"></ul>
        </div>

        <div class="actions">
            <button class="btn-undo" onclick="undoLast()">↩ Відмінити останню</button>
            <button class="btn-reset" onclick="resetAll()">Скинути все</button>
        </div>
    </div>

    <script>
        let currentSource = 'bolt';
        let history = JSON.parse(localStorage.getItem('delivery_history_v2')) || [];

        function selectTab(source) {
            currentSource = source;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tab-btn.${source}`).classList.add('active');

            const clientGroup = document.getElementById('clientFieldGroup');
            if (source === 'shabashka') {
                clientGroup.style.display = 'none';
                document.getElementById('clientPaid').value = '';
            } else {
                clientGroup.style.display = 'block';
            }
        }

        function addDelivery() {
            const client = currentSource === 'shabashka' ? 0 : (parseFloat(document.getElementById('clientPaid').value) || 0);
            const delivery = parseFloat(document.getElementById('deliveryPay').value) || 0;
            const tips = parseFloat(document.getElementById('tipsPay').value) || 0;

            if (client === 0 && delivery === 0 && tips === 0) {
                alert('Введи хоча б одне значення!');
                return;
            }

            const earnedDelta = delivery + tips;
            const kasaDelta = currentSource === 'shabashka' ? 0 : (client - (delivery + tips));

            const entry = {
                id: Date.now(),
                source: currentSource,
                client,
                delivery,
                tips,
                earnedDelta,
                kasaDelta,
                time: new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })
            };

            history.unshift(entry);
            saveAndRender();

            document.getElementById('clientPaid').value = '';
            document.getElementById('deliveryPay').value = '';
            document.getElementById('tipsPay').value = '';
        }

        function undoLast() {
            if (history.length === 0) return;
            history.shift();
            saveAndRender();
        }

        function resetAll() {
            if (confirm('Точно скинути всю касу та історію?')) {
                history = [];
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('delivery_history_v2', JSON.stringify(history));

            let boltKasa = 0, glovoKasa = 0;
            let boltEarned = 0, glovoEarned = 0, shabashkaEarned = 0;

            history.forEach(item => {
                if (item.source === 'bolt') {
                    boltKasa += item.kasaDelta;
                    boltEarned += item.earnedDelta;
                } else if (item.source === 'glovo') {
                    glovoKasa += item.kasaDelta;
                    glovoEarned += item.earnedDelta;
                } else if (item.source === 'shabashka') {
                    shabashkaEarned += item.earnedDelta;
                }
            });

            const totalKasa = boltKasa + glovoKasa;
            const totalEarned = boltEarned + glovoEarned + shabashkaEarned;

            document.getElementById('totalKasa').textContent = totalKasa.toFixed(0);
            document.getElementById('boltKasa').textContent = boltKasa.toFixed(0);
            document.getElementById('glovoKasa').textContent = glovoKasa.toFixed(0);

            document.getElementById('totalEarned').textContent = totalEarned.toFixed(0);
            document.getElementById('boltEarned').textContent = boltEarned.toFixed(0);
            document.getElementById('glovoEarned').textContent = glovoEarned.toFixed(0);
            document.getElementById('shabashkaEarned').textContent = shabashkaEarned.toFixed(0);

            const listEl = document.getElementById('historyList');
            listEl.innerHTML = '';

            if (history.length === 0) {
                listEl.innerHTML = '<li style="color:#888; font-size:13px; text-align:center;">Історія порожня</li>';
                return;
            }

            history.forEach(item => {
                const li = document.createElement('li');
                li.className = `history-item ${item.source}`;
                const titleMap = { bolt: 'Bolt', glovo: 'Glovo', shabashka: 'Шабашка' };
                const kasaText = item.source === 'shabashka' ? 'без каси' : `Каса: ${item.kasaDelta >= 0 ? '+' : ''}${item.kasaDelta}`;

                li.innerHTML = `
                    <div>
                        <strong>${titleMap[item.source]}</strong> <span style="color:#888">(${item.time})</span><br>
                        <span style="color:#555">Клієнт: ${item.client} | Дост: ${item.delivery} | Чай: ${item.tips}</span>
                    </div>
                    <div style="text-align:right; font-weight:600;">
                        <span style="color:#16a34a">+${item.earnedDelta} грн</span><br>
                        <span style="color:#d97706; font-size:12px;">${kasaText}</span>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        saveAndRender();
    </script>
</body>
</html>
